# ~/txserver/nginx/default.conf

# Use Docker DNS, and make DNS happen per request (not only at reload)
resolver 127.0.0.11 ipv6=off valid=30s;
resolver_timeout 5s;

# --- HTTP: ACME + redirect ---
server {
    listen 80 default_server;
    server_name _ tx.hl7europe.eu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/tx.hl7europe.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tx.hl7europe.eu/privkey.pem;

    # resolver 127.0.0.11 ipv6=off valid=30s;
    set $up_scheme http; set $up_host fhirserver; set $up_port 80;

    # Rewrite external /r4, /r5 paths to internal /tx/r4, /tx/r5
    location /r4/ {
        rewrite ^/r4/(.*)$ /tx/r4/$1 break;
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host tx.hl7europe.eu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /r5/ {
        rewrite ^/r5/(.*)$ /tx/r5/$1 break;
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host tx.hl7europe.eu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host tx.hl7europe.eu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tx.hl7europe.eu;

    ssl_certificate     /etc/letsencrypt/live/tx.hl7europe.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tx.hl7europe.eu/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Re-assert Docker DNS so container names resolve at request time
    # resolver 127.0.0.11 ipv6=off valid=30s;
    # resolver_timeout 5s;

    # Use variables in proxy_pass so nginx resolves at request time
    set $up_scheme http;
    set $up_host   fhirserver;
    set $up_port   80;

    # Block known bots
    if ($http_user_agent ~* "(Amazonbot|Bytespider|SemrushBot|Googlebot|Applebot|ChatGPT-User)") {
        return 403;
    }

    # Block legacy paths from old server that bots are still crawling
    location /loinc/ {
        return 410;
    }

    # Rewrite external /r4, /r5 paths to internal /tx/r4, /tx/r5
    location /r4/ {
        rewrite ^/r4/(.*)$ /tx/r4/$1 break;
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /r5/ {
        rewrite ^/r5/(.*)$ /tx/r5/$1 break;
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass $up_scheme://$up_host:$up_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}