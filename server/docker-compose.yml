services:
  fhirserver:
    # Pinned: change it with the version in tests/features/server*.feature (docs/server/updates.md).
    image: ghcr.io/healthintersections/fhirsmith:0.18.0
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "80"
    networks:
      fhir_network:
        aliases: [fhirserver]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2
    container_name: tx-caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      fhirserver:
        condition: service_started
    networks:
      - fhir_network
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certs across restarts
      - caddy_config:/config

networks:
  fhir_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
